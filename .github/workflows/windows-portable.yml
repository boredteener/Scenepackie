name: Build portable Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.16.0
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Download bundled offline components
        run: python scripts/download_assets.py
      - name: Package Scenepackie
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name Scenepackie --add-data "models;models" --add-binary "bin/ffmpeg.exe;bin" --add-binary "bin/ffprobe.exe;bin" app.py
          Compress-Archive -Path dist/Scenepackie -DestinationPath Scenepackie-Windows-Portable.zip -Force
      - name: Upload downloadable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Scenepackie-Windows-Portable
          path: Scenepackie-Windows-Portable.zip
          if-no-files-found: error
          retention-days: 30
